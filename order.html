<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Order Orio Sushi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.png" alt="Orio Sushi logo" class="logo" />
        <span class="brand-text">Orio Sushi</span>
      </a>

      <button id="mobileToggle" class="mobile-toggle" aria-label="Toggle menu">
        <span class="hamburger"></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="order.html" class="active">Order Now</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button id="cartBtn" class="cart-btn">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <h1>Order Now</h1>
    <form id="orderForm" class="order-form">
      <label>
        Full name
        <input type="text" name="name" required />
      </label>

      <label>
        Email
        <input type="email" name="email" required />
      </label>

      <label>
        Phone
        <input type="tel" name="phone" required />
      </label>

      <label>
        Address
        <textarea name="address" rows="3" required></textarea>
      </label>

      <label>
        Product
        <select name="product" required>
          <option value="classic">Classic Orio Sushi — ₱120</option>
        </select>
      </label>

      <label>
        Quantity
        <input type="number" name="quantity" min="1" value="1" required />
      </label>

      <div class="form-actions">
        <button type="submit" class="btn primary">Place Order</button>
        <button type="reset" class="btn ghost">Reset</button>
      </div>

      <div id="orderMessage" class="muted"></div>
    </form>

    <section class="quick-checkout container" style="margin-top:1.5rem;">
      <h2>Quick Checkout</h2>
      <div id="checkoutButtons">
        <button id="stripeCheckout" class="btn primary">Pay with Stripe</button>
        <button id="paypalCheckout" class="btn">Pay with PayPal</button>
      </div>
      <div id="checkoutMessage" class="muted" style="margin-top:0.5rem;"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© <span id="yearOrder"></span> Orio Sushi</div>
    </div>
  </footer>

  <script>
    document.getElementById('yearOrder').textContent = new Date().getFullYear();
    document.getElementById('stripeCheckout')?.addEventListener('click', async () => {
      const cart = JSON.parse(localStorage.getItem('oreo_cart_v1') || '[]');
      if(cart.length === 0){ alert('Your cart is empty'); return; }
      document.getElementById('checkoutMessage').textContent = 'Stripe checkout scaffold: call your server to create a session.';
    });
    document.getElementById('paypalCheckout')?.addEventListener('click', async () => {
      const cart = JSON.parse(localStorage.getItem('oreo_cart_v1') || '[]');
      if(cart.length === 0){ alert('Your cart is empty'); return; }
      document.getElementById('checkoutMessage').textContent = 'PayPal checkout scaffold: call your server to create an order.';
    });
  </script>

  <script src="js/script.js"></script>
</body>
</html>
