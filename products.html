<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products Orio Sushi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.png" alt="Orio Sushi logo" class="logo" />
        <span class="brand-text">Orio Sushi</span>
      </a>

      <button id="mobileToggle" class="mobile-toggle" aria-label="Toggle menu">
        <span class="hamburger"></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html" class="active">Products</a>
        <a href="order.html">Order Now</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button id="cartBtn" class="cart-btn">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <h1>Our Products</h1>
    <p class="muted">Choose your favorite flavor and order online.</p>

    <section class="product-grid">
      <!-- Product card template repeated -->
      <article class="product-card">
        <a href="product.html?id=classic"><img src="images/product.png" alt="Classic Orio Sushi" /></a>
        <h4>Classic Orio Sushi</h4>
        <p class="price">₱120 / box</p>
        <p class="muted">8 rolls per box</p>
        <div class="card-actions">
          <button class="btn" data-product='{"id":"classic","name":"Classic Orio Sushi","price":120}'>Add to Cart</button>
          <button class="btn ghost" onclick="openQuickView('classic')">Quick View</button>
        </div>
      </article>

      <!-- Add more product cards as needed -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© <span id="yearProducts"></span> Orio Sushi</div>
    </div>
  </footer>

  <script>
    document.getElementById('yearProducts').textContent = new Date().getFullYear();
    function openQuickView(id){
      alert('Quick view for ' + id + ' (placeholder)');
    }
  </script>
  <script src="js/script.js"></script>
</body>
</html>
